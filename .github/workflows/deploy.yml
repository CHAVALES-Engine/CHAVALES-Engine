name: Generate Docs and Deploy Quartz

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # INSTALACION DE HERRAMIENTAS
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install Doxybook2
        run: |
          wget https://github.com/matusnovak/doxybook2/releases/download/v1.5.0/doxybook2-linux-amd64.zip
          unzip doxybook2-linux-amd64.zip
          sudo mv doxybook2 /usr/local/bin/
          chmod +x /usr/local/bin/doxybook2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # GENERACION DE DOCUMENTACION
      - name: Generate Documentation
        working-directory: ./docs
        run: |
          # Limpieza
          rm -rf doxygen architecture/Code xml docs_output quartz/content
          
          # Generar XML con Doxygen
          doxygen Doxyfile
          
          # Convertir a Markdown con Doxybook2
          mkdir -p architecture/Code
          doxybook2 --input doxygen/xml --output architecture/Code --config doxybook_config.json
          
          # Pasar contenido a Quartz (Equivalente a xcopy)
          mkdir -p quartz/content
          cp -r architecture/* quartz/content/

      # BUILD DE QUARTZ
      - name: Build Quartz
        run: |
          cd quartz
          npm install
          npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps:deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4