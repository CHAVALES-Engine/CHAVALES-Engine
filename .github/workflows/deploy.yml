name: Generate Docs and Deploy Quartz

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # INSTALACION DE HERRAMIENTAS (Doxygen, Doxybook2, Node)
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install Doxybook2
        run: |
          wget https://github.com/matusnovak/doxybook2/releases/download/v1.5.0/doxybook2-linux-amd64.zip
          unzip doxybook2-linux-amd64.zip
          sudo mv doxybook2 /usr/local/bin/
          chmod +x /usr/local/bin/doxybook2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # GENERACION DE DOCUMENTACION
      - name: Generate Documentation
        working-directory: ./docs
        run: |
          rm -rf doxygen architecture/Code quartz/content
          doxygen Doxyfile
          mkdir -p architecture/Code
          doxybook2 --input doxygen/xml --output architecture/Code --config doxybook_config.json
          mkdir -p quartz/content
          cp -r architecture/* quartz/content/

      # CONSTRUCCION DE QUARTZ
      - name: Build Quartz
        working-directory: ./docs/quartz
        run: |
          npm install
          npx quartz build

      # LIMPIEZA Y PREPARACION PARA GITHUB PAGES
      - name: Move public to docs and cleanup
        run: |
          # Creamos el archivo .nojekyll para evitar el error que tuviste antes
          touch ./docs/quartz/public/.nojekyll
          
          # Copiamos el contenido de public a la raíz de /docs
          # Esto pone el index.html, css y js donde GitHub Pages los espera
          cp -r ./docs/quartz/public/* ./docs/

      # SUBIR LOS CAMBIOS AL REPOSITORIO
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ./docs/
          git commit -m "Actualizar documentacion web" || echo "No hay cambios"
          git push origin main