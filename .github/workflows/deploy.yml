name: Generate Docs and Deploy Quartz

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # INSTALACION DE HERRAMIENTAS (Doxygen, Doxybook2, Node)
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install Doxybook2
        run: |
          # Descargamos la version 1.4.0 que tiene el enlace verificado
          wget https://github.com/matusnovak/doxybook2/releases/download/v1.4.0/doxybook2-linux-amd64.zip
          unzip doxybook2-linux-amd64.zip
          # Buscamos el archivo llamado doxybook2 y lo movemos
          chmod +x doxybook2
          sudo mv doxybook2 /usr/local/bin/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # GENERACION DE DOCUMENTACION
      - name: Generate Documentation
        working-directory: ./docs
        run: |
          rm -rf doxygen architecture/Code quartz/content
          doxygen Doxyfile
          mkdir -p architecture/Code
          doxybook2 --input doxygen/xml --output architecture/Code --config doxybook_config.json
          mkdir -p quartz/content
          cp -r architecture/* quartz/content/

      # CONSTRUCCION DE QUARTZ
      - name: Build Quartz
        working-directory: ./docs/quartz
        run: |
          npm install
          npx quartz build

      # LIMPIEZA Y PREPARACION PARA GITHUB PAGES
      - name: Move public to docs and cleanup
        run: |
          # Creamos el archivo .nojekyll para evitar el error con formatos de archivos que GitHub Pages no procesa
          touch ./docs/quartz/public/.nojekyll
          
          # Copiamos el contenido de public a la raiz de /docs
          # Esto pone el index.html, css y js donde GitHub Pages los espera
          cp -r ./docs/quartz/public/* ./docs/

      # SUBIR LOS CAMBIOS AL REPOSITORIO
      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Anyadimos todos los cambios en la carpeta docs
          git add ./docs/
          
          # Verificamos si realmente hay algo que subir para evitar errores
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Docs: Update documentation and Quartz build [skip ci]"
            git push origin main
          else
            echo "No hay cambios detectados en la documentacion."
          fi